
services:
  api-gateway:
    build: .
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"  
    # volumes:
    #   - .:/app
    depends_on:
      - postgres
    env_file:
      - .env

  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: